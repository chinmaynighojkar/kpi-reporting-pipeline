[project]
name = "kpi-reporting-pipeline"
version = "0.1.0"
description = "Automated KPI reporting pipeline: synthetic e-commerce data -> Postgres star schema -> Power BI dashboards, refreshed on a schedule via GitHub Actions."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "faker>=24.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
